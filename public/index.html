<!DOCTYPE html>
<html>
<head>
    <title>Revolvapp</title>
    <meta charset="utf-8">
    <!-- Revolvapp CSS -->
    <link rel="stylesheet" href="./css/revolvapp.min.css" />
</head>
<body>
    <div id="myemail" style="max-width: 1000px; margin-left: auto; margin-right: auto;"></div>

    <!-- Revolvapp JS -->
    <script src="revolvapp.js"></script>

    <button onclick="getHtml();">Get HTML</button>

    <!-- Initialize Revolvapp -->
    <script>
        Revolvapp('#myemail', {
            editor: {
                font: 'Inter, Arial, Helvetica, sans-serif',
                path: './',
                template: './templates/index.html'
            }
        });
    </script>

    <!-- Get HTML function -->
    <script>
        function getHtml() {
            var app = Revolvapp('#myemail');
            var html = app.editor.getHtml();
            console.log("========== Generated HTML ==========");
            console.log(html);
            console.log("=====================================");
        }
    </script>
</body>
</html>
